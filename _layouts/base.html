<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  {%- if page.preload_explorer %}
  <link rel="modulepreload" href="{{ '/explore/bundle.js' | relative_url }}">
  {%- endif %}
</head>
<body>
  {% include nav.html %}
  {{ content }}
  <footer class="footer">
  <p>
  Layercake is a project of <a href="https://openstreetmap.us/">OpenStreetMap US</a>.
  Data is &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>,
  available under the <a href="https://opendatacommons.org/licenses/odbl/">Open Database License</a>.
  </p>
  </footer>
</body>
</html>
